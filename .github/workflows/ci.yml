name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo cancela el run anterior del mismo PR/rama: no gastar minutos
# corriendo CI sobre un diff que ya quedó viejo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      # Valores dummy solo para que el build no explote por env faltante.
      # No son secretos reales: los tests son puros (no tocan la base) y el
      # build no consulta datos en runtime, solo necesita que estas variables
      # existan con forma válida.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
